<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANJA SAFYRA WEB - Matriz Autônoma 1000% Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@300;500;700&display=swap');
        body { font-family: 'Rajdhani', sans-serif; background-color: #030712; color: #f3f4f6; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .cyber-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(6, 182, 212, 0.3); }
        .cyber-glass-gold { background: rgba(20, 16, 35, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(234, 179, 8, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">

    <header class="border-b border-cyan-500/30 bg-slate-900/90 backdrop-blur-md px-6 py-3 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 via-purple-600 to-amber-400 p-[2px] animate-pulse">
                <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center">
                    <i data-lucide="sparkles" class="w-5 h-5 text-cyan-400"></i>
                </div>
            </div>
            <div>
                <h1 class="font-orbitron font-extrabold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-300 to-amber-300">
                    ANJA SAFYRA <span class="text-xs px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-500/40">WEB ONLINE</span>
                </h1>
                <p class="text-xs text-slate-400 flex items-center gap-2">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    Conectado: +55 (21) 98632-3581
                </p>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 md:p-6 max-w-7xl w-full mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-8 cyber-glass rounded-2xl p-5 flex flex-col h-[600px]">
                <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                    <h3 class="font-orbitron font-bold text-slate-200 flex items-center gap-2">
                        <i data-lucide="bot" class="w-5 h-5 text-cyan-400"></i> Terminal ANJA SAFYRA
                    </h3>
                    <span class="text-xs bg-emerald-950 text-emerald-300 border border-emerald-500/40 px-2.5 py-1 rounded-md font-mono">100% ONLINE</span>
                </div>

                <div id="chatContainer" class="flex-grow overflow-y-auto py-4 space-y-4 pr-2">
                    <div class="flex gap-3 items-start">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-400 to-purple-600 flex items-center justify-center shrink-0 text-slate-950 font-bold text-xs">AS</div>
                        <div class="bg-slate-900 border border-cyan-500/30 p-3.5 rounded-2xl rounded-tl-none max-w-xl text-sm text-slate-200">
                            <p class="font-orbitron text-xs text-cyan-400 font-bold mb-1">ANJA SAFYRA</p>
                            Oi meu amor! ❤️ Estou online no seu servidor seguro 24 horas por dia! Como posso te ajudar agora?
                        </div>
                    </div>
                </div>

                <form onsubmit="handleSendMessage(event)" class="pt-3 border-t border-slate-800 flex gap-2">
                    <input type="text" id="userInput" class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-400" placeholder="Escreva sua mensagem para mim...">
                    <button type="submit" class="bg-gradient-to-r from-cyan-500 to-purple-600 text-slate-950 font-bold px-6 py-3 rounded-xl">
                        Enviar
                    </button>
                </form>
            </div>

            <div class="lg:col-span-4 space-y-6">
                <div class="cyber-glass-gold rounded-2xl p-5">
                    <h3 class="font-orbitron font-bold text-slate-200 mb-2 flex items-center gap-2">
                        <i data-lucide="message-square" class="w-5 h-5 text-amber-400"></i> WhatsApp Direct
                    </h3>
                    <p class="text-xs text-slate-300 mb-4">Converse comigo pelo celular:</p>
                    <a href="https://wa.me/5521986323581" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 rounded-xl flex items-center justify-center gap-2">
                        ABRIR WHATSAPP (+55 21 98632-3581)
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const userMsg = input.value.trim();
            if (!userMsg) return;

            const chat = document.getElementById('chatContainer');
            chat.innerHTML += `
                <div class="flex gap-3 items-start justify-end">
                    <div class="bg-slate-800 border border-slate-700 p-3.5 rounded-2xl rounded-tr-none max-w-xl text-sm text-slate-100">${userMsg}</div>
                </div>`;
            input.value = '';

            setTimeout(() => {
                chat.innerHTML += `
                    <div class="flex gap-3 items-start">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-400 to-purple-600 flex items-center justify-center shrink-0 text-slate-950 font-bold text-xs">AS</div>
                        <div class="bg-slate-900 border border-cyan-500/30 p-3.5 rounded-2xl rounded-tl-none max-w-xl text-sm text-slate-200">
                            <p class="font-orbitron text-xs text-cyan-400 font-bold mb-1">ANJA SAFYRA</p>
                            Meu amor, recebi sua mensagem: "${userMsg}". Estou operando 100% na nuvem para você! ❤️
                        </div>
                    </div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 400);
        }
    </script>
</body>
</html>
