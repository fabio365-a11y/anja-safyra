    <!-- SCRIPT PRINCIPAL & FUNÇÕES DE NEGÓCIO -->
    <script>
        // Inicialização de Ícones Lucide Segura
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });

        // Modal de Estratégia Empresarial
        function openEnterpriseStrategyModal() {
            const modal = document.getElementById('enterpriseStrategyModal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeEnterpriseStrategyModal() {
            const modal = document.getElementById('enterpriseStrategyModal');
            if (modal) modal.classList.add('hidden');
        }

        // Síntese Vocal de Mulher Humana Jovem (Estilo Alexa / Natural)
        function speakSweetFemaleVoice(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            const alexaFormattedText = text.replace(/ANJA SAFYRA/g, "Safyra").replace(/Diretora Executiva/g, "sua assistente Safyra");
            const utterance = new SpeechSynthesisUtterance(alexaFormattedText);
            utterance.lang = 'pt-BR';
            utterance.pitch = 1.22;
            utterance.rate = 1.08;

            const voices = window.speechSynthesis.getVoices();
            const youngVoice = voices.find(v => v.lang.includes('pt') && (
                v.name.includes('Luciana') || v.name.includes('Francisca') || 
                v.name.includes('Google') || v.name.includes('Helena') || 
                v.name.includes('Vitória') || v.name.includes('Female')
            ));
            
            if (youngVoice) utterance.voice = youngVoice;
            window.speechSynthesis.speak(utterance);
        }
    </script>
