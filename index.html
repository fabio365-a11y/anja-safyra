<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S. — Open Web AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="arc-dot" id="statusDot"></span>
        <div>
          <h1>J.A.R.V.I.S.</h1>
          <p class="subtitle">Just A Rather Very Intelligent System • Open Web</p>
        </div>
      </div>

      <div class="controls">
        <label class="toggle">
          <input type="checkbox" id="voiceOutputToggle" checked />
          <span>Voz (TTS)</span>
        </label>
        <button id="openSettingsBtn" class="btn btn-ghost" type="button">Configurar IA</button>
      </div>
    </header>

    <main class="main-grid">
      <section class="hud-panel">
        <div class="reactor" id="reactor">
          <div class="ring ring-outer"></div>
          <div class="ring ring-mid"></div>
          <div class="ring ring-inner"></div>
          <span class="reactor-label" id="reactorState">STANDBY</span>
        </div>

        <div class="quick-actions">
          <h2>Comandos Rápidos</h2>
          <button class="chip" data-cmd="Que horas são e qual a data de hoje?">Hora e Data</button>
          <button class="chip" data-cmd="Mostre o status do sistema e do navegador">Status do Sistema</button>
          <button class="chip" data-cmd="Resuma como funciona a arquitetura desse assistente web">Arquitetura</button>
          <button class="chip" data-cmd="Limpar conversa">Limpar Chat</button>
        </div>
      </section>

      <section class="chat-panel">
        <div id="chatLog" class="chat-log" aria-live="polite"></div>

        <form id="commandForm" class="composer">
          <button id="micBtn" class="btn btn-mic" type="button" title="Falar comando">
            🎤
          </button>
          <input
            id="commandInput"
            type="text"
            placeholder="Digite ou fale um comando para o J.A.R.V.I.S...."
            autocomplete="off"
            required
          />
          <button class="btn btn-primary" type="submit">Enviar</button>
        </form>
      </section>
    </main>
  </div>

  <!-- Modal de Configuração da LLM -->
  <dialog id="settingsModal" class="modal">
    <form method="dialog" class="modal-card" id="settingsForm">
      <h2>Configuração do Cérebro (LLM)</h2>
      <p class="modal-desc">
        A chave fica apenas no <code>localStorage</code> do seu navegador. Sem chave, o J.A.R.V.I.S. opera em modo local/comandos.
      </p>

      <label>
        Provedor compatível com OpenAI Chat Completions (ex: Groq, OpenRouter)
        <select id="providerSelect">
          <option value="groq">Groq (Llama / Mixtral)</option>
          <option value="openrouter">OpenRouter</option>
          <option value="custom">Endpoint Customizado</option>
        </select>
      </label>

      <label id="customUrlLabel" class="hidden">
        URL Base (`/v1/chat/completions`)
        <input type="url" id="customUrlInput" placeholder="https://api.exemplo.com/v1/chat/completions" />
      </label>

      <label>
        Modelo
        <input type="text" id="modelInput" value="llama-3.3-70b-versatile" />
      </label>

      <label>
        API Key
        <input type="password" id="apiKeyInput" placeholder="gsk_... ou sk-or-..." />
      </label>

      <label>
        Personalidade / System Prompt
        <textarea id="systemPromptInput" rows="3">Você é o J.A.R.V.I.S., um assistente técnico inteligente, objetivo, prestativo e elegante. Responda em português do Brasil.</textarea>
      </label>

      <div class="modal-actions">
        <button type="button" id="clearKeyBtn" class="btn btn-ghost">Apagar Chave</button>
        <button type="button" id="cancelSettingsBtn" class="btn btn-ghost">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
